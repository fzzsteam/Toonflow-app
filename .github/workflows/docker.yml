name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则读 package.json）"
        required: false
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    name: 构建并推送 Docker 镜像

    permissions:
      contents: read

    steps:
      - name: 检出后端代码
        uses: actions/checkout@v4

      - name: 检出前端代码（Toonflow-web，master 分支）
        run: |
          git clone --branch master --depth 1 \
            "https://x-access-token:${{ secrets.ORG_REPO_TOKEN }}@github.com/fzzsteam/Toonflow-web.git" \
            ../Toonflow-web

      - name: 获取版本号
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 安装 aliyun CLI 并登录 ACR
        env:
          ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACR_AK_ID }}
          ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACR_AK_SECRET }}
          ALIBABACLOUD_REGION_ID: ${{ vars.SAE_REGION_ID }}
        run: |
          curl -sLo /tmp/aliyun-cli.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf /tmp/aliyun-cli.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/aliyun

          AUTH_JSON=$(aliyun cr GetAuthorizationToken)
          TOKEN=$(echo "$AUTH_JSON" | jq -r '.authorizationToken')
          USERNAME=$(echo "$AUTH_JSON" | jq -r '.tempUserName')
          echo "$TOKEN" | docker login \
            crpi-7ajeyduewy90avu4.cn-shenzhen.personal.cr.aliyuncs.com \
            --username="$USERNAME" \
            --password-stdin

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          build-contexts: |
            web=../Toonflow-web
          platforms: linux/amd64
          push: true
          tags: |
            crpi-7ajeyduewy90avu4.cn-shenzhen.personal.cr.aliyuncs.com/fzzs/toonflow:${{ steps.version.outputs.tag }}
            crpi-7ajeyduewy90avu4.cn-shenzhen.personal.cr.aliyuncs.com/fzzs/toonflow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 清理 ACR 旧版本 tag（保留最新 3 个）
        env:
          ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACR_AK_ID }}
          ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACR_AK_SECRET }}
          ALIBABACLOUD_REGION_ID: ${{ vars.SAE_REGION_ID }}
        run: |
          if [ -z "$ALIBABACLOUD_ACCESS_KEY_ID" ]; then
            echo "ALIYUN_ACR_AK_ID 未配置，跳过 ACR tag 清理"
            exit 0
          fi

          TAGS_JSON=$(aliyun cr GetRepoTags \
            --RepoNamespace fzzs \
            --RepoName toonflow 2>/dev/null || echo '{"data":{"tags":[]}}')

          TAGS_TO_DELETE=$(echo "$TAGS_JSON" | \
            jq -r '.data.tags[] | select(.tag | test("^v")) | [.imageCreate, .tag] | @tsv' 2>/dev/null | \
            sort -t$'\t' -k1 -rn | \
            awk 'NR>3 {print $2}')

          if [ -z "$TAGS_TO_DELETE" ]; then
            echo "无需清理（v* tag 数量 ≤ 3）"
          else
            for TAG in $TAGS_TO_DELETE; do
              echo "删除旧 tag: $TAG"
              aliyun cr DeleteRepoTag \
                --RepoNamespace fzzs \
                --RepoName toonflow \
                --Tag "$TAG" || echo "警告：删除 $TAG 失败，继续"
            done
            echo "清理完成"
          fi

      - name: 部署到 SAE 生产应用
        env:
          ALIBABACLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_SAE_AK_ID }}
          ALIBABACLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_SAE_AK_SECRET }}
          ALIBABACLOUD_REGION_ID: ${{ vars.SAE_REGION_ID }}
          SAE_PROD_APP_ID: ${{ secrets.SAE_PROD_APP_ID }}
        run: |
          if [ -z "$SAE_PROD_APP_ID" ]; then
            echo "SAE_PROD_APP_ID 未配置，跳过生产部署"
            exit 0
          fi

          aliyun sae DeployApplication \
            --AppId "$SAE_PROD_APP_ID" \
            --ImageUrl "crpi-7ajeyduewy90avu4-vpc.cn-shenzhen.personal.cr.aliyuncs.com/fzzs/toonflow:${{ steps.version.outputs.tag }}"

          echo "SAE 生产环境部署已触发，请在控制台确认发布状态"
          echo "镜像：crpi-7ajeyduewy90avu4-vpc.cn-shenzhen.personal.cr.aliyuncs.com/fzzs/toonflow:${{ steps.version.outputs.tag }}"
