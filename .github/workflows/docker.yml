name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则读 package.json）"
        required: false
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    name: 构建并推送 Docker 镜像

    permissions:
      contents: read

    steps:
      - name: 检出后端代码
        uses: actions/checkout@v4

      - name: 检出前端代码（Toonflow-web）
        run: |
          if [ -n "${{ secrets.GITEE_TOKEN }}" ]; then
            git clone https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/shenzhen-fangzhi-zhisheng/Toonflow-web.git ../Toonflow-web
          else
            git clone https://gitee.com/shenzhen-fangzhi-zhisheng/Toonflow-web.git ../Toonflow-web
          fi

      - name: 获取版本号
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ACR（阿里云深圳）
        uses: docker/login-action@v3
        with:
          registry: crpi-7ajeyduewy90avu4.cn-shenzhen.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          build-contexts: |
            web=../Toonflow-web
          platforms: linux/amd64
          push: true
          tags: |
            crpi-7ajeyduewy90avu4.cn-shenzhen.personal.cr.aliyuncs.com/fzzs/default:${{ steps.version.outputs.tag }}
            crpi-7ajeyduewy90avu4.cn-shenzhen.personal.cr.aliyuncs.com/fzzs/default:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出结果
        run: |
          echo "✅ 推送完成"
          echo "ACR：crpi-7ajeyduewy90avu4.cn-shenzhen.personal.cr.aliyuncs.com/fzzs/default:${{ steps.version.outputs.tag }}"
